[project]
name = "coinvoy-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pypdf>=6.21.1",
    "scikit-learn>=1.9.1",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the intended pattern

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S311"]  # seeded randomness for reproducible data, not security

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
