# Render blueprint (decisions.md T2): the API + PWA as a web service, the ML service private, Postgres, all in Singapore.
services:
  - type: web
    name: coinvoy
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: coinvoy-db, property: connectionString }
      - key: ML_URL
        fromService: { type: pserv, name: coinvoy-ml, property: hostport }
      - key: ML_TOKEN
        fromGroup: coinvoy-secrets
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_URL
        sync: false # https://<your-app>.onrender.com, exactly as the browser sees it
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_PROVIDER_NAME
        sync: false
      - key: LLM_REGION_NOTE
        sync: false
      - key: VAPID_PUBLIC_KEY # payday reminder; generate with web-push generate-vapid-keys
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ADMIN_EMAILS
        sync: false
  - type: pserv
    name: coinvoy-ml
    runtime: docker
    dockerfilePath: ./Dockerfile.ml
    dockerContext: .
    region: singapore
    plan: starter
    envVars:
      - key: ML_TOKEN
        fromGroup: coinvoy-secrets
      - key: RATE_MODEL # "gbm" only after the pooled model wins the real backtest
        sync: false

envVarGroups:
  - name: coinvoy-secrets
    envVars:
      - key: ML_TOKEN
        generateValue: true

databases:
  - name: coinvoy-db
    region: singapore
    plan: basic-256mb
