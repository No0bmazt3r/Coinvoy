# Checks the Supabase database on every push to main and runs its migrations only when the repository owner starts
# it by hand:
#   push to main       checks reachability and reports whether migration is needed
#   manual "check"     checks reachability and pending migrations without changing anything
#   manual "migrate"   checks, then applies pending migrations
#   check    is the database reachable? which migrations are pending? (changes nothing)
#   migrate  the same, then applies the pending ones
# Run "migrate" before deploying backend code that changes the database (Render builds and deploys the backend).
#
# Why nobody else can run it: the job runs only when the owner both started the run and (for a re-run) clicked
# re-run, and only on main; DATABASE_URL lives in the "production" GitHub Environment, which only main may use.
name: Database (Supabase)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [check, migrate]
        default: check

concurrency:
  group: database
  cancel-in-progress: false

permissions:
  contents: read

run-name: Database ${{ inputs.action || 'check' }} for ${{ github.sha }}

jobs:
  database:
    name: ${{ inputs.action == 'migrate' && 'Check and migrate' || 'Check' }} database
    outputs:
      migration_needed: ${{ steps.migration-status.outputs.migration_needed }}
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL_CA: ${{ secrets.DATABASE_SSL_CA }}
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod --filter coinvoy-api
      - name: Secrets present?
        run: |
          # Without DATABASE_URL the API falls back to its built-in local database, so this would "migrate" a
          # throwaway copy on GitHub's machine and pass without touching Supabase. Stop instead.
          case "$DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "DATABASE_URL is missing or isn't a postgres:// address (GitHub → Settings → Environments → production)." >&2; exit 1 ;; esac
      - name: Is the database reachable, and what's pending?
        id: check
        run: node scripts/migrate.ts --check
      - name: Report whether migration is needed
        id: migration-status
        run: |
          if [ "${{ steps.check.outputs.pending }}" = "0" ]; then
            echo "migration_needed=false" >> "$GITHUB_OUTPUT"
            echo "migration_needed=false" >> "$GITHUB_STEP_SUMMARY"
            echo "No migration is needed."
          else
            echo "migration_needed=true" >> "$GITHUB_OUTPUT"
            echo "migration_needed=true" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.check.outputs.pending }} migration(s) need to be applied."
          fi
      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'migrate' && steps.check.outputs.pending != '0'
        run: node scripts/migrate.ts
