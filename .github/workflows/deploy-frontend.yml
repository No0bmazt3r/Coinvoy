# Deploys the app (frontend/) to Vercel production, only when the repository owner starts it by hand:
# Actions → "Deploy app (Vercel)" → Run workflow (branch: main). Pushes, pull requests and merges never trigger it.
#
# The run gates deployment in this order:
#   1. Confirm that the separate "Coinvoy checks" workflow passed for this exact commit.
#   2. Wait for the production environment approval, then deploy to Vercel.
#
# Why nobody else can deploy:
# - The jobs run only if the owner both started the run and (for a re-run) clicked re-run, and only on main.
# - The Vercel secrets live in the "production" GitHub Environment, which only main may use. A collaborator who edits
#   this file on another branch, or adds a workflow of their own, can't reach them; main itself can't change without
#   the owner's approval (the protect-main ruleset).
# Setup: README → Deployment → "The app on Vercel".
name: Deploy app (Vercel)

on:
  workflow_dispatch:

# One deployment at a time; a second click waits for the first to finish
concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-checks:
    name: Verify Coinvoy checks
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    steps:
      - name: Require successful checks for this commit
        run: |
          conclusion=$(gh run list \
            --workflow checks.yml \
            --commit "$GITHUB_SHA" \
            --status completed \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // empty')
          if [ "$conclusion" != "success" ]; then
            echo "Coinvoy checks has not passed for commit $GITHUB_SHA (result: ${conclusion:-not found})." >&2
            echo "Push the commit to main, wait for Coinvoy checks to finish, then run this workflow again." >&2
            exit 1
          fi
          echo "Coinvoy checks passed for commit $GITHUB_SHA."
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to Vercel
    needs: verify-checks
    runs-on: ubuntu-latest
    environment:
      name: production # holds the secrets; only main may use it
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: npm install --global vercel@62.5.0
      # Run from the repo root: the Vercel project's Root Directory is frontend/ (Vercel's monorepo docs)
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      # Builds here on the runner, using frontend/vercel.json (pnpm install, pnpm build, dist/)
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to production: $url" >> "$GITHUB_STEP_SUMMARY"
