# Keeps the backend awake: Render's free plan sleeps after 15 minutes without traffic (about a minute to wake), and a
# Supabase free project pauses after 7 days without database activity. Every 10 minutes this calls
# /api/health?db=1, which wakes the server and runs one tiny query. It never deploys or changes anything.
# Needs the repository variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables).
# GitHub may delay scheduled runs at busy times, so an occasional cold start can still happen.
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # "Run workflow" to wake it by hand, e.g. just before a demo

permissions: {}

jobs:
  ping:
    name: Ping backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "BACKEND_URL isn't set yet: nothing to ping."; exit 0; fi
          # a sleeping server can take about a minute to answer, so allow for it and retry once
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 15 "$BACKEND_URL/api/health?db=1"
