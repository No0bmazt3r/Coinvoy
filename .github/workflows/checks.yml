# Runs on every push and pull request: lint, types, tests, bundle size and a secret scan.
name: Coinvoy checks
on:
  push:
  pull_request:

jobs:
  ml:
    name: ML engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.1" }
      - run: uv sync --directory ml
      - run: uv run --directory ml ruff check .
      - run: uv run --directory ml pytest -q

  api:
    name: API (${{ matrix.db == 'postgres' && 'Postgres' || 'PGlite' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [pglite, postgres]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: coinvoy, POSTGRES_PASSWORD: coinvoy, POSTGRES_DB: coinvoy_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.1" }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --directory ml # the API tests talk to the real ML service
      - run: pnpm --filter coinvoy-api typecheck
      - run: pnpm --filter coinvoy-api lint
      - run: pnpm --filter coinvoy-api test
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://coinvoy:coinvoy@localhost:5432/coinvoy_test' || '' }}

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter coinvoy-frontend typecheck
      - run: pnpm --filter coinvoy-frontend lint
      - run: pnpm --filter coinvoy-frontend test
      - run: pnpm --filter coinvoy-frontend build
      - name: First load stays under 300 KB gzipped
        run: |
          size=$(cat frontend/dist/assets/index-*.js frontend/dist/assets/index-*.css | gzip -c | wc -c)
          echo "initial bundle: $size bytes gzipped"
          test "$size" -le 307200

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
