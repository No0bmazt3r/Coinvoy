# Weekly pull requests for outdated or vulnerable dependencies, grouped so they don't flood the repo.
version: 2
updates:
  - package-ecosystem: npm # the pnpm workspace (frontend + api)
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # @types/node follows the Node we run (24, set in package.json "engines"); bump it with Node itself
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: uv # the ML service
    directory: /ml
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] } # one pull request for all CI action updates
